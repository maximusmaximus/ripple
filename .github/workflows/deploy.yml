name: Deploy

# Auto-deploys the production build on every push to main.
# Requires GitHub secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Create a token at https://vercel.com/account/tokens and paste the org/project
# IDs from `npx vercel link` (or the Vercel project settings page).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eu
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::warning::Vercel secrets are not set. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under repo Settings → Secrets and variables → Actions so pushes auto-update the live app."
            echo "Build still ran locally in CI. Skipping live deploy."
            exit 0
          fi
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
